# CI for SplitScope.
#
# This workflow mirrors the local verification commands documented in README.md.
# It has NOT been executed on GitHub-hosted runners; it is configuration only,
# written to be proportional to this project (two jobs, no secrets, no
# external services).
#
# Local equivalents (see README.md):
#   backend:  python -m pytest -q ; python scripts/evaluate_synthetic.py
#             python scripts/generate_datasets.py --check
#   frontend: npm run test ; npm run lint ; npm run typecheck ; npm run build
#             npx playwright test   (Playwright starts/stops its own backend)

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + synthetic evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies (declared, pinned)
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend test suite
        working-directory: backend
        run: python -m pytest -q

      - name: Synthetic evaluation (exit 1/2 propagates as a failed step)
        run: python scripts/evaluate_synthetic.py

      - name: Committed demo datasets are reproducible
        run: python scripts/generate_datasets.py --check

  frontend:
    name: Frontend tests, lint, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The E2E suite starts `python -m app.main` itself (Playwright webServer),
      # so the backend runtime dependencies must be importable by `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies (for the E2E webServer)
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Frontend dependencies (clean install from the lockfile)
        working-directory: frontend
        run: npm ci

      - name: Unit / component tests
        working-directory: frontend
        run: npm run test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

      # Installs the browser binary only (system dependencies are handled by
      # --with-deps on the hosted Linux runner). `npm run test:e2e` rebuilds
      # first so the bundle under test is never stale; the config keeps
      # retries: 0 and starts a fresh backend per run, stopped on completion.
      - name: Install Playwright Chromium with system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end journey (Chromium, managed servers)
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
